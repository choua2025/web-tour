# ── Deploy: production ──────────────────────────────────────────────
# The CD half. API / Storefront / Admin each build, test and publish one
# image; this takes the three that are current on the default branch, pins
# them to their digests, and rolls them onto the deploy target.
#
# It never builds anything. If an image is missing, this stops rather than
# shipping a stale mixture of releases.
#
# Runs on a self-hosted runner living on the user's own WSL Ubuntu machine
# — no inbound access, SSH key or password involved. The runner reaches out
# to GitHub for the job and does everything in its own shell, which already
# IS the deploy target, so this is a normal `docker compose` rollout with no
# network transport in the middle.
#
# What lives at DEPLOY_PATH on the runner:
#   docker-compose.deploy.yml   copied from the repo on every deploy
#   remote-up.sh                the rollout + rollback script, same
#   .env                        rendered here from secrets, never committed
#   .env.previous                the last good .env — the rollback

name: Deploy production

on:
  # Fires after a build workflow finishes on the default branch. workflow_run
  # also fires on failure, so the job below checks the conclusion first.
  workflow_run:
    workflows: [API, Storefront, Admin]
    types: [completed]
    branches: [main, master]

  # Redeploy, or pin a specific tag, without pushing a commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (latest, sha-<full sha>, v1.2.0)'
        required: false
        default: latest

# Deploys queue rather than cancel: interrupting one halfway would leave the
# runner's Docker running containers from two different releases.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Roll out to production
    runs-on: [self-hosted, linux, wsl-ubuntu]
    timeout-minutes: 20

    # Skip the runs where the build failed. A manual dispatch carries no
    # workflow_run context, so it always passes this.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # Hang required reviewers, the deployment URL and the production
    # secrets off this in Settings → Environments. Without it, any green
    # build on main goes straight to production unattended.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    permissions:
      contents: read
      packages: read

    env:
      TAG: ${{ inputs.tag || 'latest' }}
      STACK_NAME: travel-prod

    steps:
      - uses: actions/checkout@v4

      # Resolved in the runner's own shell rather than the YAML `${{ }}`
      # expression above — a literal '$HOME' baked into that expression
      # would never get expanded, since GitHub Actions evaluates `${{ }}`
      # before any shell sees the value.
      - name: Resolve the deploy path
        run: echo "DEPLOY_PATH=${DEPLOY_PATH:-$HOME/travel/production}" >> "$GITHUB_ENV"
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is a moving target: it can point somewhere else five
      # minutes from now, so a run told to deploy `latest` cannot say what
      # it deployed and cannot be rolled back to it. Resolving to a digest
      # here freezes the release, and makes the saved .env a complete,
      # replayable description of it.
      - name: Resolve tags to digests
        id: images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for pair in api:travel-booking-api admin:travel-booking-admin storefront:travel-booking-storefront; do
            svc="${pair%%:*}"; repo="${pair#*:}"
            ref="ghcr.io/${owner}/${repo}:${TAG}"

            if ! digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null); then
              echo "::error::no image at ${ref} — has the ${svc} build workflow published one?"
              exit 1
            fi

            echo "${svc}: ${ref} -> ${digest}"
            echo "${svc}_image=ghcr.io/${owner}/${repo}@${digest}" >> "$GITHUB_OUTPUT"
          done

      # Values arrive through `env:` and are written with printf rather than
      # pasted into the script text, so a password containing a quote, a $
      # or a backtick cannot break the file or get executed. Written
      # straight to DEPLOY_PATH — no transfer step, this shell already runs
      # on the deploy target.
      - name: Render .env
        env:
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          ADMIN_IMAGE: ${{ steps.images.outputs.admin_image }}
          STOREFRONT_IMAGE: ${{ steps.images.outputs.storefront_image }}

          API_PORT: ${{ vars.API_PORT || '9001' }}
          ADMIN_PORT: ${{ vars.ADMIN_PORT || '3000' }}
          STOREFRONT_PORT: ${{ vars.STOREFRONT_PORT || '3001' }}

          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          LOG_REQUESTS: ${{ vars.LOG_REQUESTS || 'false' }}

          DB_NAME: ${{ vars.DB_NAME || 'booking_system' }}
          DB_USER: ${{ vars.DB_USER || 'postgres' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          MAIL_HOST: ${{ vars.MAIL_HOST || 'smtp.gmail.com' }}
          MAIL_PORT: ${{ vars.MAIL_PORT || '587' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          # Fail here, naming the missing setting, rather than three minutes
          # later with an opaque compose error.
          for required in DB_PASSWORD JWT_SECRET PUBLIC_API_URL FRONTEND_URL; do
            if [ -z "${!required}" ]; then
              echo "::error::${required} is empty — set it on the production environment (see deploy/README.md)"
              exit 1
            fi
          done

          mkdir -p "$DEPLOY_PATH"
          umask 077
          : > "$DEPLOY_PATH/.env.incoming"
          for k in STACK_NAME API_IMAGE ADMIN_IMAGE STOREFRONT_IMAGE \
                   API_PORT ADMIN_PORT STOREFRONT_PORT \
                   PUBLIC_API_URL FRONTEND_URL LOG_REQUESTS \
                   DB_NAME DB_USER DB_PASSWORD JWT_SECRET \
                   MAIL_HOST MAIL_PORT MAIL_USER MAIL_PASS \
                   CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET \
                   STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            printf '%s=%s\n' "$k" "${!k}" >> "$DEPLOY_PATH/.env.incoming"
          done

      - name: Place the compose file and rollout script
        run: cp deploy/docker-compose.deploy.yml deploy/remote-up.sh "$DEPLOY_PATH/"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          cd "$DEPLOY_PATH"
          chmod +x remote-up.sh
          ./remote-up.sh

      # Healthy containers are not the same as a working site: the API can
      # be up while unable to reach its database, and a front end can
      # render while pointing at the wrong API. These hit the real URLs —
      # `localhost` is valid here since this shell runs on the same machine
      # that's now serving the stack.
      - name: Smoke-test production
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          STOREFRONT_URL: ${{ vars.PRODUCTION_URL }}
          ADMIN_URL: ${{ vars.ADMIN_URL }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # A rollout takes a moment to settle; give it one.
          for i in $(seq 1 30); do
            curl -fsS "$PUBLIC_API_URL/health" -o health.json && break
            sleep 2
          done
          [ -s health.json ] || fail "$PUBLIC_API_URL/health never answered"
          cat health.json; echo

          grep -q '"status":"ok"' health.json          || fail "/health did not report ok"
          grep -q '"database":"connected"' health.json || fail "the API cannot reach its database"
          # The migrate container already ran, so nothing should be left.
          # If this trips, a migration failed and the schema is behind the
          # code.
          grep -q '"pendingMigrations":0' health.json  || fail "migrations are still pending after deploy"

          if [ -n "$STOREFRONT_URL" ]; then
            curl -fsS -o /dev/null -w 'storefront %{http_code}\n' "$STOREFRONT_URL/" || fail "the storefront did not answer"
          fi
          if [ -n "$ADMIN_URL" ]; then
            curl -fsS -o /dev/null -w 'admin      %{http_code}\n' "$ADMIN_URL/login" || fail "the admin console did not answer"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy — ${{ job.status }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${TAG}\` |"
            echo "| deploy path | \`${DEPLOY_PATH}\` |"
            echo "| api | \`${{ steps.images.outputs.api_image }}\` |"
            echo "| admin | \`${{ steps.images.outputs.admin_image }}\` |"
            echo "| storefront | \`${{ steps.images.outputs.storefront_image }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
