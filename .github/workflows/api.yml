# ── API (booking-tratvel) ───────────────────────────────────────────
# Runs only when the API changes. The two front ends have their own
# workflows so a storefront tweak does not rebuild the API image.
#
# Three stages, chained with `needs:` so each only starts once the one
# before it succeeds — a broken commit stops before anything reaches GHCR:
#
#   build (does the image even build?)
#     -> test (does the app actually work, against a real Postgres?)
#       -> publish (push the image — only for a push to main/master)
#
# `publish` is the actual GHCR push. Deploying that image onto the runner is
# a separate workflow (deploy-production.yml), triggered once this whole
# workflow finishes — so there are really five stages end to end, just not
# all expressible as `needs:` in one file: `needs:` only chains jobs inside
# the same workflow, and deploy-production.yml also waits on Storefront and
# Admin, which live in their own workflow files.

name: API

on:
  push:
    branches: [main, master]
    paths:
      - 'booking-tratvel/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'booking-tratvel/**'
      - '.github/workflows/api.yml'
  # Lets you rebuild from the Actions tab without pushing a commit.
  workflow_dispatch:

# A second push to the same branch cancels the first — no point finishing a
# build for a commit that has already been superseded.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: booking-tratvel

jobs:
  # ── stage 1: does the image even build? ───────────────────────────
  # Builds the Docker image but pushes nothing anywhere — a Dockerfile-level
  # break (a bad COPY, a dependency that only resolves outside Docker) is a
  # different failure mode than the app-level checks in `test`, and this
  # catches it before the slower Postgres-backed job even starts. The layer
  # cache it writes here is what makes `publish`'s later, real build fast.
  build:
    name: Build image (no push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (cache only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./booking-tratvel
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ── stage 2: does the API actually work? ──────────────────────────
  test:
    name: Test against a real Postgres
    needs: build
    runs-on: ubuntu-latest

    # A throwaway database for this job only. Reachable on localhost:5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the steps below start before Postgres accepts
        # connections and fail on the first migration.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: booking_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      PORT: 9001
      HOST: 127.0.0.1
      LOG_REQUESTS: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booking-tratvel/package-lock.json

      # `npm ci` (not `npm install`) — it fails loudly when package.json and
      # package-lock.json have drifted apart, which is exactly the breakage
      # that stops a Docker build later.
      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run migrate:up

      # `migrate status` prints PENDING beside any file it has not run.
      - name: Nothing left pending
        run: |
          npm run migrate | tee status.txt
          if grep -q "PENDING" status.txt; then
            echo "::error::migrations still pending after migrate:up"
            exit 1
          fi

      # The models and the migrations drifted apart once already: Booking
      # declared number_of_people and no migration ever created it. It went
      # unnoticed because the development database had been built by
      # sequelize.sync() and had the column anyway — but a database built
      # from these files alone did not, and every booking insert failed.
      # This runs against exactly such a database, so the same drift cannot
      # come back unnoticed.
      - name: Models match the migrated schema
        run: npm run check:schema

      # The point of this step: a migration that cannot be undone is a
      # migration you cannot roll back in production. Rolling all the way
      # down and back up proves every down() works and that a clean database
      # can be rebuilt from zero.
      - name: Migrations roll back and re-apply
        run: |
          npm run migrate:down -- --all --yes
          npm run migrate:up

      # Booting the server imports every route, controller, model and util,
      # so this catches syntax errors, bad imports and circular dependencies
      # that no linter here would. Then /api/health proves it reached the
      # database.
      - name: Boot and health-check
        run: |
          node server.js & echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9001/api/health > health.json 2>/dev/null; then
              echo "API answered after ${i}s"; break
            fi
            sleep 1
          done
          kill "$(cat server.pid)" 2>/dev/null || true

          cat health.json
          grep -q '"status":"ok"' health.json \
            || { echo "::error::/api/health did not report ok"; exit 1; }
          grep -q '"database":"connected"' health.json \
            || { echo "::error::API booted but cannot reach the database"; exit 1; }

  # ── stage 3: publish the image ─────────────────────────────────────
  # Only reached if both build and test succeeded, so nothing broken ever
  # gets a real tag on GHCR. Rebuilds — but `cache-from` pulls every layer
  # stage 1 already produced, so this is normally seconds, not minutes.
  publish:
    name: Push image to GHCR
    needs: test
    # Pull requests get build + test only. Publishing from a PR would let a
    # fork overwrite your images.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # A first-time push to a package GHCR has not seen before needs the
    # repo's default GITHUB_TOKEN permission set to "Read and write" under
    # Settings → Actions → General → Workflow permissions. This block alone
    # cannot escalate past a repo set to "Read only" — if the push below
    # fails with "permission_denied: write_package", that setting is why.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions — nothing to configure.
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase in image names and org names are often mixed
      # case, so normalise before using it as a tag.
      - name: Work out the image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/travel-booking-api" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./booking-tratvel
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same cache scope as `build`, so this reuses those layers instead
          # of reinstalling node_modules and re-copying source from scratch.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Summary
        run: |
          {
            echo "### API image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
