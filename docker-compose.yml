# Travel Booking — full stack for local runs and small deployments.
#
#   docker compose up -d --build
#
# Ports mirror the local dev setup so nothing else has to change:
#   9001  API          3000  admin console        3001  storefront
#
# Secrets come from a .env file next to this one (copy .env.docker.example).
# Nothing sensitive is written into an image.

name: travel-booking

services:
  # ── database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-booking_system}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Published so you can still point psql or a GUI at it. Drop this line to
    # keep Postgres reachable only from inside the compose network.
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      # Without this the API would start before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-booking_system}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── schema ────────────────────────────────────────────────────────
  # A one-shot job rather than something the API does at boot: several API
  # replicas starting together would otherwise race each other through the
  # same migrations.
  migrate:
    # Same image as `api`, deliberately without its own `build:` — two services
    # building the same tag in parallel makes buildkit collide on the export.
    # Compose builds every buildable service before starting containers, so the
    # tag already exists by the time this one runs.
    image: travel-booking/api:${TAG:-latest}
    pull_policy: never
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-booking_system}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    # `up` applies only what is pending, so re-running compose is harmless.
    # On a database whose tables predate migration tracking, run
    # `docker compose run --rm migrate npm run migrate:baseline` once first.
    command: ["npm", "run", "migrate:up"]

  # ── API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./booking-tratvel
    image: travel-booking/api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 9001
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_REQUESTS: ${LOG_REQUESTS:-true}

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-booking_system}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      # Refuses to boot if this is missing or left at a placeholder.
      JWT_SECRET: ${JWT_SECRET}

      # Where Stripe returns the customer after checkout — the STOREFRONT.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}

      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${API_PORT:-9001}:9001"

  # ── admin console ─────────────────────────────────────────────────
  admin:
    build:
      context: ./travel-plan-admin
    image: travel-booking/admin:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      # The browser makes this call, not the container, so it must be an
      # address the browser can reach — not http://api:9001.
      NUXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:9001/api}
    ports:
      - "${ADMIN_PORT:-3000}:3000"

  # ── storefront ────────────────────────────────────────────────────
  storefront:
    build:
      context: ./booking-frontend
    image: travel-booking/storefront:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      # Read by the visitor's browser.
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_URL:-http://localhost:9001/api}
      # Read by this container. The confirmation page renders its receipt
      # during SSR, and in here `localhost` is the storefront itself — so the
      # public URL above would fail and the receipt would come out empty.
      # On this network the API is simply `api`.
      NUXT_API_BASE_SERVER: http://api:9001/api
    ports:
      - "${STOREFRONT_PORT:-3001}:3001"

volumes:
  db-data:
